<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel screenshots</title>
    <style>
      /* the Home Assistant variables that the panel uses, light and dark as in the default theme */
      :root {
        --primary-color: #03a9f4;
        --text-primary-color: #fff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --card-background-color: #fff;
        --secondary-background-color: #e5e5e5;
        --divider-color: #e0e0e0;
        --warning-color: #ff9800;
        --error-color: #db4437;
        --success-color: #43a047;
        --paper-font-body1_-_font-family: Roboto, 'Segoe UI', sans-serif;
      }
      :root.dark {
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --card-background-color: #1c1c1c;
        --secondary-background-color: #282828;
        --divider-color: #3c3c3c;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #fafafa;
        font-family: Roboto, 'Segoe UI', sans-serif;
      }
      :root.dark body {
        background: #111;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { fixtures } from '/fixtures.mjs';
      import '/panel.js';

      const params = new URLSearchParams(location.search);
      const lang = params.get('lang') === 'de' ? 'de' : 'en';
      if (params.get('theme') === 'dark') document.documentElement.classList.add('dark');
      const data = fixtures(lang);
      const copy = (value) => structuredClone(value);

      /** What the backend answers to the commands that the panel sends. */
      const answers = {
        info: () => data.info,
        'templates/list': () => data.templates,
        'templates/save': (m) => {
          const saved = { id: m.template_id, name: m.name, model: 'Custom', bundled: false, entities: m.entities };
          data.templates = [...data.templates.filter((t) => t.id !== saved.id), saved];
          return saved;
        },
        'templates/delete': (m) => {
          data.templates = data.templates.filter((t) => t.id !== m.template_id);
          return {};
        },
        'devices/get': (m) => data.devices.find((d) => d.id === m.device),
        'devices/names': () => ({ devices: data.devices }),
        'devices/list': () => ({ total: data.devices.length, devices: data.devices }),
        'schedules/list': () => data.schedules,
        'schedules/preview': () => data.runs,
        'scenarios/list': () => data.scenarios,
        'groups/list': () => data.groups,
        'removal/plan': () => data.removalPlan,
        'history/import': () => data.historyResult,
      };

      const hass = {
        language: lang,
        areas: data.areas,
        callWS: async (message) => {
          const answer = answers[message.type.replace('hass_test_data_creator/', '')];
          return answer ? copy(answer(message)) : {};
        },
      };
      // the panel reads the backend when it is added, so it gets `hass` first
      const panel = document.createElement('hass-test-data-creator-panel');
      panel.hass = hass;
      document.body.append(panel);
      window.__ready = true;
    </script>
  </body>
</html>
