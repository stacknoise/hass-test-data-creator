[project]
name = "hass-test-data-creator"
version = "0.4.0"
description = "HASS Test Data Creator - HACS integration for test devices and test data in test environments"
license = "Apache-2.0"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["slow: performance tests, run nightly"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["docs/review"]

[tool.ruff.lint]
select = [
    "A",     # builtins shadowing
    "ASYNC", # async pitfalls
    "B",     # bugbear
    "BLE",   # blind except (only allowed in core/command.py, concept 13.3)
    "C4",    # comprehensions
    "C90",   # mccabe complexity
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "PL",    # pylint
    "RUF",   # ruff specific
    "S",     # bandit rules
    "SIM",   # simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "D202",    # blank line after function docstring (nested functions)
    "E501",    # line length is handled by ruff format
    "PLR2004", # magic values in comparisons
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Constructors of managers receive their collaborators as arguments (concept 13.2).
[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.hass_test_data_creator"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR0913", "PLR0917"]
"scripts/**" = ["S101", "RUF001"]  # en dashes in generated Markdown headers

[tool.bandit]
exclude_dirs = ["tests"]
