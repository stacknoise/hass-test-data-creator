create_devices:
  fields:
    template:
      required: true
      example: plug_metering
      selector:
        text:
    count:
      required: true
      example: 24
      selector:
        number:
          min: 1
          max: 500
          mode: box
    name_pattern:
      example: "Plug {nn}"
      selector:
        text:
    areas:
      example: '["Living room", "Kitchen"]'
      selector:
        object:
    area_mode:
      default: even
      selector:
        select:
          options: [even, random]
    seed:
      example: tdc-0042
      selector:
        text:
    label:
      selector:
        text:
    output:
      default: native
      selector:
        select:
          options: [native]
    entities:
      example: '[{"key": "level", "platform": "sensor", "name": "Level", "signal": {"shape": "sine", "min": 0, "max": 100}}]'
      selector:
        object:

fire_event:
  fields:
    device:
      required: true
      example: Plug 01
      selector:
        text:
    entity:
      required: true
      example: state
      selector:
        text:
    action:
      required: true
      example: toggle
      selector:
        text:
    params:
      selector:
        object:

remove:
  fields:
    target:
      required: true
      selector:
        select:
          options: [device, run]
    target_id:
      required: true
      selector:
        text:

remove_all:

add_schedule:
  fields:
    name:
      required: true
      example: Evening toggles
      selector:
        text:
    target:
      example: '{"template": "plug_metering"}'
      selector:
        object:
    entity:
      example: state
      selector:
        text:
    action:
      example: toggle
      selector:
        text:
    scenario:
      selector:
        text:
    params:
      selector:
        object:
    trigger:
      required: true
      example: '{"type": "random_window", "count": 3, "start": "18:00", "end": "23:00"}'
      selector:
        object:
    seed:
      selector:
        text:
    enabled:
      default: true
      selector:
        boolean:

remove_schedule:
  fields:
    schedule_id:
      required: true
      selector:
        text:

set_schedule_enabled:
  fields:
    schedule_id:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

add_scenario:
  fields:
    name:
      required: true
      example: Leaving home
      selector:
        text:
    steps:
      required: true
      example: '[{"target": {"template": "light"}, "entity": "light", "action": "turn_off"}, {"after_s": 30, "target": {"all": true}, "entity": "state", "action": "turn_off"}]'
      selector:
        object:

remove_scenario:
  fields:
    scenario_id:
      required: true
      selector:
        text:

run_scenario:
  fields:
    scenario_id:
      required: true
      selector:
        text:
