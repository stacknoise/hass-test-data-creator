name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"
  PMD_VERSION: "7.28.0"
  # SHA-256 of pmd-dist-${PMD_VERSION}-bin.zip; update together with PMD_VERSION.
  PMD_SHA256: "f974ba571f7bc01c73fffe11bade25fbc1f438698f9e9c00e416e8d65e9fbac2"

jobs:
  lint:
    name: ruff, bandit, code index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements_lint.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: bandit
        run: bandit -c pyproject.toml -r custom_components scripts
      - name: Code index up to date (concept 13.5)
        run: python scripts/code_index.py --check

  cpd:
    name: Copy-paste detection (CPD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install PMD
        run: |
          curl -sSfL -o pmd.zip "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip"
          echo "${PMD_SHA256}  pmd.zip" | sha256sum --check --strict
          unzip -q pmd.zip
      - name: CPD Python (fails from 100 duplicated tokens, concept 13.6)
        run: |
          "pmd-bin-${PMD_VERSION}/bin/pmd" cpd --language python --minimum-tokens 100 \
            --dir custom_components --dir scripts --format text
      - name: CPD TypeScript (fails from 100 duplicated tokens, concept 13.6)
        run: |
          "pmd-bin-${PMD_VERSION}/bin/pmd" cpd --language typescript --minimum-tokens 100 \
            --dir panel-src/src --format text

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements_test.txt
      - run: pytest -p no:cacheprovider -m "not slow" --cov=custom_components.hass_test_data_creator --cov-report=term-missing

  panel:
    name: Panel (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel-src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel-src/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Built panel is up to date (concept 9)
        run: git diff --exit-code -- ../custom_components/hass_test_data_creator/frontend
