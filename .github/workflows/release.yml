name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: manifest.json version equals tag (concept 14)
        run: |
          version=$(jq -r .version custom_components/hass_test_data_creator/manifest.json)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::manifest.json version ${version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
