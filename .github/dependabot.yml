version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      # init and analyze must always have the same version.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Pinned to the minimum supported HA version; raise together with hacs.json.
      - dependency-name: pytest-homeassistant-custom-component

  - package-ecosystem: npm
    directory: /panel-src
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The lint packages have to match each other's eslint version.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "typescript-eslint"
          - "eslint-plugin-*"
      # vitest needs a matching vite. A new vite also changes the built panel in the repo:
      # run `npm run build` in panel-src and commit the result with the update.
      vite:
        patterns:
          - "vite"
          - "vitest"
